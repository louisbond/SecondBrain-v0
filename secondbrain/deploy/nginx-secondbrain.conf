# SecondBrain 反向代理站点（phpStudy / Nginx）
#
# 安装：把本文件复制到
#   D:\AllApp666\phpstudy_pro\Extensions\Nginx1.15.11\conf\vhosts\
# 然后在 phpStudy 面板里「重载 Nginx」即可。
#
# 访问地址：http://127.0.0.1:8088
# （想用域名 secondbrain.local，需管理员权限在 hosts 里加一行：
#   127.0.0.1 secondbrain.local
#  加完后访问 http://secondbrain.local:8088）
#
# 前置条件：SecondBrain 服务已在 127.0.0.1:7688 运行
# （双击 SecondBrain.exe，或用设置页的「注册开机自启」）。

server {
    listen 8088;
    server_name secondbrain.local localhost 127.0.0.1;

    # 大文件上传（视频/音频）放宽限制
    client_max_body_size 512m;
    client_body_timeout 600s;

    # 摘要任务可能跑一两分钟，别被 nginx 掐断
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    location / {
        proxy_pass http://127.0.0.1:7688;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
